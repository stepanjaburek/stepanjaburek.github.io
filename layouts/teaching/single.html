{{ define "main" }}
{{ $teaching := hugo.Data.teaching }}

<section class="page-content teaching-page">
  <h1 class="page-title">Teaching</h1>
  
  {{ with $teaching }}
    <div class="teaching-list">
      {{ range . }}
        <div class="teaching-item">
          <h2 class="course-title">{{ .course }}</h2>
          <div class="teaching-meta">
            <span class="role">{{ .role }}</span> &middot; {{ .institution }} &middot; {{ .term }}
          </div>
        </div>
      {{ end }}
    </div>
  {{ else }}
    <p>No teaching history listed at the moment.</p>
  {{ end }}
</section>
{{ end }}
